<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Syed Ayan Husain - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.55" stop-color="#0c1224"/>
      <stop offset="1" stop-color="#160c2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#c084fc;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#22d3ee;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="auraL" cx="0.17" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraR" cx="0.75" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avatarBg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="300" fill="url(#gridFade)"/></mask>
    <clipPath id="avatarClip"><circle cx="170" cy="150" r="86"/></clipPath>
    <filter id="glowBig" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glowSmall" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .hi   { font: 600 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 5px; fill: #67e8f9; }
      .name { font: 800 54px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; }
      .role { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.5px; fill: #c7d2fe; }
      .chip { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: #e2e8f0; }
      .init { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; }
      .spin  { transform-origin: 170px 150px; animation: spin 14s linear infinite; }
      .spinR { transform-origin: 170px 150px; animation: spin 22s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1000" height="300" rx="24" fill="url(#auraL)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="300" rx="24" fill="url(#auraR)">
    <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <g>
    <circle cx="360" cy="58" r="1.6" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cy" values="58;42;58" dur="4.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="250" r="1.2" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="250;234;250" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="40" r="1.4" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="40;26;40" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="262" r="1.2" fill="#c084fc" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="262;246;262" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="110" r="2" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="3.0s" repeatCount="indefinite"/><animate attributeName="cy" values="110;94;110" dur="3.5s" begin="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="1.6" fill="#c084fc" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="5.0s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="240;224;240" dur="5.0s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="50" r="1.6" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="cy" values="50;36;50" dur="4.2s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="262" r="1.4" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.9s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="cy" values="262;246;262" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="48" r="1.2" fill="#f0abfc" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4.6s" begin="3.4s" repeatCount="indefinite"/><animate attributeName="cy" values="48;34;48" dur="4.6s" begin="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing border -->
  <rect x="3" y="3" width="994" height="294" rx="22" fill="none" stroke="url(#border)" stroke-width="3" filter="url(#glowSmall)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="3" width="994" height="294" rx="22" fill="none" stroke="url(#border)" stroke-width="1.2"/>

  <!-- ===== Avatar ===== -->
  <circle cx="170" cy="150" r="104" fill="url(#ring)" opacity="0.35" filter="url(#soft)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- rotating rings -->
  <g class="spin">
    <circle cx="170" cy="150" r="100" fill="none" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-dasharray="210 60 90 60 100 108"/>
    <circle cx="170" cy="50" r="4" fill="#ffffff" filter="url(#glowSmall)"/>
    <circle cx="170" cy="50" r="2" fill="#ffffff"/>
  </g>
  <g class="spinR">
    <circle cx="170" cy="150" r="111" fill="none" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 10"/>
  </g>
  <!-- photo frame -->
  <circle cx="170" cy="150" r="90" fill="url(#ring)"/>
  <circle cx="170" cy="150" r="86" fill="url(#avatarBg)"/>
  <!-- initials fallback (photo covers this once embedded) -->
  <text x="170" y="172" text-anchor="middle" class="init" fill="url(#neon)">SA</text>
  <!--AVATAR-->
  <!-- online dot -->
  <circle cx="234" cy="214" r="13" fill="#0b1020"/>
  <circle cx="234" cy="214" r="8" fill="#22c55e">
    <animate attributeName="r" values="8;9.5;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="234" cy="214" r="8" fill="none" stroke="#22c55e" stroke-width="2">
    <animate attributeName="r" values="8;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== Text ===== -->
  <text x="330" y="88" class="hi">HI THERE, I'M</text>

  <text x="328" y="150" class="name" fill="url(#neon)" filter="url(#glowBig)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.5s" repeatCount="indefinite"/>SYED AYAN HUSAIN</text>
  <text x="328" y="150" class="name" fill="url(#neon)" filter="url(#glowSmall)" opacity="0.8">SYED AYAN HUSAIN</text>
  <text x="328" y="150" class="name" fill="#ffffff">SYED AYAN HUSAIN</text>

  <!-- underline with travelling light -->
  <rect x="330" y="168" width="420" height="3" rx="1.5" fill="url(#neon)" opacity="0.85"/>
  <circle cy="169.5" r="5" fill="#ffffff" filter="url(#glowSmall)"><animate attributeName="cx" values="330;750;330" dur="4s" repeatCount="indefinite"/></circle>
  <circle cy="169.5" r="2.2" fill="#ffffff"><animate attributeName="cx" values="330;750;330" dur="4s" repeatCount="indefinite"/></circle>

  <!-- rotating roles -->
  <text x="330" y="206" class="role" opacity="0">&gt; Full Stack Developer  ·  MERN Stack
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.22;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
  <text x="330" y="206" class="role" opacity="0">&gt; Java  ·  Spring Boot  ·  Spring AI
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.22;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
  <text x="330" y="206" class="role" opacity="0">&gt; DSA Enthusiast  ·  C++
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.22;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
  <text x="330" y="206" class="role" opacity="0">&gt; Aspiring Software Engineer
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.22;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>

  <!-- chips -->
  <g>
    <rect x="330" y="230" width="178" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="419" y="251" text-anchor="middle" class="chip">🎓 ECE @ JIIT NOIDA</text>
    <rect x="520" y="230" width="158" height="32" rx="16" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="599" y="251" text-anchor="middle" class="chip">📍 NOIDA, INDIA</text>
    <rect x="690" y="230" width="226" height="32" rx="16" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.5"/>
    <text x="803" y="251" text-anchor="middle" class="chip">🤝 OPEN TO COLLABORATE</text>
  </g>
</svg>
