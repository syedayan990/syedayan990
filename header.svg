<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Syed Ayan - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.5" stop-color="#0d1326"/><stop offset="1" stop-color="#140d2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#c084fc;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#22d3ee;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glowSmall" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="edge" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .name { font: 800 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 10px; }
      .role { font: 500 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #c7d2fe; }
      .tag  { font: 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="22" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="361" cy="68" r="2" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="68;54;68" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="404" cy="179" r="1" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.7s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="179;165;179" dur="5.7s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="474" cy="137" r="1" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.3s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;123;137" dur="3.3s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="876" cy="174" r="1" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.8s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="174;160;174" dur="5.8s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="179" r="2" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="179;165;179" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="326" cy="137" r="1.2" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.4s" begin="2.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;123;137" dur="4.4s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="178" r="1.2" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="178;164;178" dur="3.8s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="607" cy="45" r="1.2" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;31;45" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="506" cy="179" r="2" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="179;165;179" dur="3.8s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="745" cy="229" r="1.2" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="229;215;229" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="926" cy="117" r="2" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="3.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="117;103;117" dur="3.5s" begin="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="554" cy="137" r="1.2" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.1s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;123;137" dur="5.1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="461" cy="40" r="1" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.2s" begin="2.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;26;40" dur="5.2s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="378" cy="207" r="1.6" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.6s" begin="2.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="207;193;207" dur="4.6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="53" r="1.6" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="2.7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="53;39;53" dur="4.2s" begin="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="778" cy="209" r="1.6" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="4.0s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="209;195;209" dur="4.8s" begin="4.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="321" cy="213" r="2" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.6s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="213;199;213" dur="5.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="393" cy="73" r="1" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="73;59;73" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="162" cy="219" r="1.2" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.9s" begin="3.7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="219;205;219" dur="3.9s" begin="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112" cy="72" r="2" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.9s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="72;58;72" dur="3.9s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="868" cy="140" r="1.6" fill="#c084fc" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5.0s" begin="3.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;126;140" dur="5.0s" begin="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="266" cy="68" r="1" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="68;54;68" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- glowing border -->
  <rect x="3" y="3" width="994" height="254" rx="20" fill="none" stroke="url(#border)" stroke-width="3" filter="url(#edge)" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="3" width="994" height="254" rx="20" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <!-- name: blurred glow layers + crisp text -->
  <text x="500" y="112" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#glowBig)" opacity="0.8">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.5s" repeatCount="indefinite"/>SYED AYAN
  </text>
  <text x="500" y="112" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#glowSmall)" opacity="0.9">SYED AYAN</text>
  <text x="500" y="112" text-anchor="middle" class="name" fill="#ffffff">SYED AYAN</text>

  <!-- animated underline with travelling light -->
  <rect x="300" y="132" width="400" height="3" rx="1.5" fill="url(#neon)" opacity="0.85"/>
  <circle cy="133.5" r="5" fill="#ffffff" filter="url(#glowSmall)">
    <animate attributeName="cx" values="300;700;300" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="133.5" r="2.2" fill="#ffffff">
    <animate attributeName="cx" values="300;700;300" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating roles -->
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">Full Stack Developer  ·  MERN Stack
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.07;0.29;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">DSA Enthusiast  ·  C++ &amp; Java
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.07;0.29;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="178" text-anchor="middle" class="role" opacity="0">Aspiring Software Engineer
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.07;0.29;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="222" text-anchor="middle" class="tag">BUILDING  ·  LEARNING  ·  SHIPPING</text>
</svg>
