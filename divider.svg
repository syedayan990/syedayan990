<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="0.75" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="b" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="40" y="12" width="920" height="4" rx="2" fill="url(#g)" filter="url(#b)">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="40" y="13" width="430" height="2" rx="1" fill="url(#g)"/>
  <rect x="530" y="13" width="430" height="2" rx="1" fill="url(#g)"/>
  <!-- centre gem -->
  <g transform="translate(500 14)">
    <rect x="-9" y="-9" width="18" height="18" rx="3" transform="rotate(45)" fill="#818cf8" filter="url(#b)" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="2" transform="rotate(45)" fill="#0b1020" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle r="2" fill="#ffffff"/>
  </g>
  <!-- travelling sparks -->
  <circle cy="14" r="3" fill="#fff" filter="url(#b)"><animate attributeName="cx" values="60;460;60" dur="5s" repeatCount="indefinite"/></circle>
  <circle cy="14" r="1.6" fill="#fff"><animate attributeName="cx" values="60;460;60" dur="5s" repeatCount="indefinite"/></circle>
  <circle cy="14" r="3" fill="#fff" filter="url(#b)"><animate attributeName="cx" values="940;540;940" dur="5s" repeatCount="indefinite"/></circle>
  <circle cy="14" r="1.6" fill="#fff"><animate attributeName="cx" values="940;540;940" dur="5s" repeatCount="indefinite"/></circle>
</svg>
